<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Puppetify builds custom websites and AI-powered workflow automations for businesses, creators, agencies, and solopreneurs." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/puppet_logo.png" />

    <!-- Tailwind CSS Script -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

        theme: {
